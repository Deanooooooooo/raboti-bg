name: Private preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current preview
        uses: actions/checkout@v5
        with:
          ref: main
          path: current
      - name: Check out handover concept
        uses: actions/checkout@v5
        with:
          ref: identity/cofoundy-v1
          path: concept
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            concept/package-lock.json
      - name: Build current preview at the existing URL
        working-directory: current
        run: npm ci && npm run build && node scripts/prepare-github-pages.mjs
        env:
          DEPLOY_BASE: /raboti-bg
      - name: Build handover concept at a separate URL
        working-directory: concept
        run: npm ci && npm run build && node scripts/prepare-github-pages.mjs
        env:
          DEPLOY_BASE: /raboti-bg/concept-handover
      - name: Add concept without replacing current preview
        run: |
          mkdir -p current/dist/concept-handover
          cp -R concept/dist/. current/dist/concept-handover/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: current/dist
      - id: deployment
        uses: actions/deploy-pages@v4
